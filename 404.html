<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - STACKLY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .error-404-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
        }
        .error-content {
            position: relative;
            z-index: 2;
        }
        .glitch-text {
            font-size: 10rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin: 0;
            text-shadow: 0 10px 30px rgba(92, 67, 246, 0.3);
            position: relative;
            display: inline-block;
        }
        /* Simple subtle pulse for the 404 */
        @keyframes subtlePulse {
            0% { transform: scale(1); text-shadow: 0 10px 30px rgba(92, 67, 246, 0.3); }
            50% { transform: scale(1.02); text-shadow: 0 20px 40px rgba(92, 67, 246, 0.6); }
            100% { transform: scale(1); text-shadow: 0 10px 30px rgba(92, 67, 246, 0.3); }
        }
        .pulse-anim {
            animation: subtlePulse 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="error-404-wrap">
        <!-- Interactive Particle Background -->
        <div id="particles-js" class="particles-js"></div>
        
        <div class="error-content fade-in">
            <h1 class="glitch-text pulse-anim float-anim">404!</h1>
            <h2 class="reveal-text" style="font-size: 2.5rem; margin: 16px 0;">Lost in the Cloud</h2>
            <p style="color: var(--text-light); font-size: 1.1rem; max-width: 500px; margin: 0 auto 40px;">The resource you are looking for has been moved, deleted, or never existed in the first place.</p>
            
            <div class="error-actions" style="display: flex; justify-content: center; gap: 16px;">
                <div class="magnetic-wrap">
                    <button onclick="history.back()" class="btn btn-secondary magnetic-btn"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
                </div>
                <div class="magnetic-wrap">
                    <a href="index.html" class="btn btn-primary magnetic-btn"><i class="fa-solid fa-house"></i> Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts for animations (Magnetic buttons, Custom Cursor, Particles) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
